<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="https://static.qgov.net.au/qgds-bootstrap5/v2/v2.x.x-latest/assets/css/qld.bootstrap.css">
  <link rel="stylesheet" href="{{ '/assets/css/digcomp.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="qg-header">
    <div class="container">
      <p class="site-tag">Queensland Government</p>
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
  </header>

  <nav class="site-nav" aria-label="Main navigation">
    <div class="container">
      <ul class="nav-list">
        <li><a href="{{ '/#framework' | relative_url }}">Framework</a></li>
        <li><a href="{{ '/#assessment' | relative_url }}">Assessment</a></li>
        <li><a href="{{ '/#learning' | relative_url }}">Learning</a></li>
        <li><a href="{{ '/#about' | relative_url }}">About</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p><strong>Queensland Government Digital Capability Hub</strong> proof-of-concept</p>
      <p>Contact the Digital Capability Team: <a href="mailto:digitalictcapability@chde.qld.gov.au">digitalictcapability@chde.qld.gov.au</a></p>
    </div>
  </footer>
</body>
</html>
